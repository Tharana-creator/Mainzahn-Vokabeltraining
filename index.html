  // Häufige längere PDF-Worttrennungen, bei denen beide Teile > 5 Zeichen lang sind.
  const rawFixes={
    "Speichelpr\noduktion":"Speichelproduktion",
    "benachbar\nter":"benachbarter",
    "verschiede\nnen":"verschiedenen",
    "beschichte\nten":"beschichteten",
    "unbeschic\nhteten":"unbeschichteten",
    "ansteigend\ne":"ansteigende",
    "Zahnzwisc\nhenräume":"Zahnzwischenräume",
    "Brückengli\nedern":"Brückengliedern",
    "provisorisc\nher":"provisorischer",
    "vollkermisc\nhen":"vollkeramischen",
    "Instrument\narium":"Instrumentarium",
    "chirurgisch\ne":"chirurgische",
    "maschinell\nen":"maschinellen",
    "Aufbereitu\nng":"Aufbereitung",
    "integrierte\nm":"integriertem",
    "Vollkerami\nsche":"Vollkeramische",
    "Verblendsc\nhale":"Verblendschale",
    "Wurzelbeh\nandlungen":"Wurzelbehandlungen",
    "Nahtmateri\nal":"Nahtmaterial",
    "Aufwachst\nechnik":"Aufwachstechnik",
    "Simulation\neiner":"Simulation einer",
    "prothetisch\nen":"prothetischen",
    "Zahnfehlst\ellungen":"Zahnfehlstellungen",
    "Ausräume\nn":"Ausräumen",
    "Wurzelspit\nze":"Wurzelspitze",
    "beginnend\nen":"beginnenden",
    "Mundtrock\nenheit":"Mundtrockenheit",
    "Medikame\nnte":"Medikamente",
    "Zystenbalg\ns":"Zystenbalgs",
    "benachbar\nter":"benachbarter",
    "Körperhöhl\nen":"Körperhöhlen"
  };
  for(const [a,b] of Object.entries(rawFixes)) raw=raw.split(a).join(b);
  let t=tidy(raw);
  const fixes={
    "Teilprothes e":"Teilprothese","Geschiebe n":"Geschieben","abgestorb enes":"abgestorbenes",
    "mangelnde r":"mangelnder","Blutversor gung":"Blutversorgung","Schmerzm ittel":"Schmerzmittel",
    "Schmerze n":"Schmerzen","betreffend e":"betreffende","Bewusstse insverlust":"Bewusstseinsverlust",
    "Prämolare n":"Prämolaren","Wurzelkan al":"Wurzelkanal","Zahnfleisc hspitze":"Zahnfleischspitze",
    "Zahnfleisc h":"Zahnfleisch","Knochens ubstanz":"Knochensubstanz","Kompositf üllungen":"Kompositfüllungen",
    "eingeschra ubt":"eingeschraubt","Gefühlswa hrnehmun g":"Gefühlswahrnehmung",
    "Entzündun g":"Entzündung","Behandlun g":"Behandlung","Aufklappu ng":"Aufklappung",
    "Schleimha ut":"Schleimhaut","Kiefergele nk":"Kiefergelenk","Kaumuskul atur":"Kaumuskulatur",
    "Spüllösung für gangränös e":"Spüllösung für gangränöse","Wurzelkan äle":"Wurzelkanäle",
    "Schmerza usschaltun g":"Schmerzausschaltung","Nichtedel metall":"Nichtedelmetall",
    "Backenzäh ne":"Backenzähne","Implantatk örper":"Implantatkörper","Implantata ufbau":"Implantataufbau",
    "Abformung verbunden":"Abformung verbunden","Abdruckm aterial":"Abdruckmaterial",
    "Haftvermitt ler":"Haftvermittler","Zahnschm elz":"Zahnschmelz","Anwendun g":"Anwendung",
    "zusammen ziehend":"zusammenziehend","Einschleif en":"Einschleifen","therapeutis che":"therapeutische",
    "Kiefergele nksbeschw erden":"Kiefergelenksbeschwerden","vollkomme ne":"vollkommene",
    "Ansammlu ng":"Ansammlung","Abflußmög lichkeit":"Abflußmöglichkeit","Implantata ufbauteil":"Implantataufbauteil",
    "blutverdün nender":"blutverdünnender","Oberfläche n":"Oberflächen","Kunstoffkle bern":"Kunstoffklebern",
    "Aufbau des Zahnes":"Aufbau des Zahnes","Röntgenübersichtsauf nahme":"Röntgenübersichtsaufnahme"
  };
  for(const [a,b] of Object.entries(fixes)) t=t.split(a).join(b);
  // Einzelne abgetrennte Buchstaben am Wortende (z. B. „Schmerze n“, „betreffend e“).
  t=t.replace(/([A-Za-zÄÖÜäöüß]{3,})\s+([a-z])(?=([ ,.;:!?)\]]|$))/g,"$1$2");
  return t.replace(/\s{2,}/g," ").trim();
};
const compactText=s=>repairWordBreaks(s).toLocaleLowerCase("de-DE").replace(/[^a-z0-9äöüß]/g,"");
function cleanStoredText(s){
  const t=tidy(s);
  const key=compactText(t);
  if(!key) return t;
  for(const list of MONTHS){
    for(const v of list){
      for(const candidate of [v.term,v.meaning,v.practice,v.prep]){
        if(candidate && compactText(candidate)===key) return repairWordBreaks(candidate);
      }
    }
  }
  return repairWordBreaks(t);
}
const now=()=>new Date();
const examMonth=()=>now().getMonth()+1;
const exerciseMonth=()=>{const d=now(),m=d.getMonth()+1;return d.getDate()>=21?(m%12)+1:m};
const examOpen=()=>{const d=now().getDate();return d>=16&&d<=20;};
const monthName=m=>names[m-1]||`Monat ${m}`;
const isTrainer=()=>String(state.profile?.role||"").toLowerCase()==="ausbilder";
function fail(t,d=""){app.innerHTML=`<main><div class="card"><h1>Mainzahn</h1><div class="error"><b>${esc(t)}</b>${d?`<br><br>${esc(d)}`:""}</div></div></main>`}
let sb;

async function loginScreen(){
 app.innerHTML=`<main><div class="card login"><div class="logo">Mainzahn</div><p class="muted">Azubi Vokabeltrainer</p><h2>Anmelden</h2><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button id="login">Anmelden</button><div id="err" class="error hidden"></div></div></main>`;
 document.getElementById("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){err.textContent=error.message;err.classList.remove("hidden")}else await boot()};
}

function shell(content){
 const tabs=isTrainer()
   ? `<button class="${state.tab==='home'?'active':''}" data-tab="home">Übersicht</button><button class="${state.tab==='results'?'active':''}" data-tab="results">Ergebnisse</button>`
   : `<button class="${state.tab==='home'?'active':''}" data-tab="home">Übersicht</button><button class="${state.tab==='learn'?'active':''}" data-tab="learn">Übung</button><button class="${state.tab==='exam'?'active':''}" data-tab="exam">Prüfung</button>`;
 app.innerHTML=`<header><div class="top"><div><div class="brand">Mainzahn</div><div class="sub">${isTrainer()?'Ausbilderbereich':'Azubi Vokabeltrainer'}</div></div><button id="out" class="secondary">Abmelden</button></div></header><main><div class="tabs">${tabs}</div>${content}</main>`;
 document.getElementById('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{state.tab=b.dataset.tab;state.exam=null;if(state.tab==="results")await loadTrainerResults();render()});
}

function home(){
 if(isTrainer()){
   return `<div class="card"><h1>Willkommen, ${esc(state.profile.full_name)}</h1><p class="muted">Rolle: Ausbilder</p><div class="notice">Hier siehst du die Prüfungsergebnisse der Azubis – einschließlich der falsch beantworteten Vokabeln.</div><button data-go="results">Ergebnisse ansehen</button></div>`;
 }
 const em=exerciseMonth(),xm=examMonth();
 return `<div class="card"><div class="row"><div><h1>Willkommen, ${esc(state.profile.full_name)}</h1><p class="muted">Rolle: ${esc(state.profile.role)}</p></div><span class="badge">${examOpen()?"Prüfung freigeschaltet":"Übungsphase"}</span></div></div><div class="grid"><div class="card learn"><h2>Übung – ${monthName(em)}</h2><div class="stat">${MONTHS[em-1].length}</div><div class="muted">Vokabeln</div><br><button data-go="learn">Übung starten</button></div><div class="card exam ${examOpen()?'':'locked'}"><h2>Prüfung – ${monthName(xm)}</h2><div class="stat">${examOpen()?MONTHS[xm-1].length:'–'}</div><div class="muted">${examOpen()?'Vokabeln':'nur vom 16.–20. freigeschaltet'}</div><br><button data-go="exam" ${examOpen()?'':'disabled'}>Prüfung starten</button></div></div><div class="notice">Ab dem <b>21. des Vormonats</b> beginnt die Übungsphase für den Folgemonat. Die Prüfung des aktuellen Monats ist nur vom <b>16.–20.</b> freigeschaltet.</div>`;
}

function learnView(){
 const m=exerciseMonth(),list=MONTHS[m-1],i=Math.min(state.learn,list.length-1),v=list[i];
 return `<div class="card"><div class="row"><h2>Übung – ${monthName(m)}</h2><span>${i+1} / ${list.length}</span></div><div class="progress"><div class="bar" style="width:${((i+1)/list.length)*100}%"></div></div><br><h3>${esc(repairWordBreaks(v.term))}</h3><p style="font-size:20px;line-height:1.55">${esc(repairWordBreaks(v.meaning))}</p>${v.practice?`<p><b>Praxis:</b> ${esc(repairWordBreaks(v.practice))}</p>`:''}${v.prep?`<p><b>Aufbereitung:</b> ${esc(repairWordBreaks(v.prep))}</p>`:''}<div class="row"><button id="prev" class="secondary">Zurück</button><button id="next">Weiter</button></div></div>`;
}

function makeChoices(list,i){
 const correct=tidy(list[i].meaning);
 let pool=list.map(x=>tidy(x.meaning)).filter(x=>x&&x!==correct);
 pool.sort(()=>Math.random()-.5);
 return [correct,...pool.slice(0,3)].sort(()=>Math.random()-.5);
}

async function saveExamResult(x,list){
 const score=Math.round(x.correct/list.length*100);
 const payload={
   user_id:state.user.id,
   month:examMonth(),
   year:now().getFullYear(),
   score,
   correct_count:x.correct,
   total_count:list.length,
   mistakes:x.mistakes,
   completed_at:new Date().toISOString()
 };
 const {error}=await sb.from("exam_results").insert(payload);
 if(error){console.error(error);x.saveError=error.message}else{x.saved=true}
}

function mistakeList(items){
 if(!items?.length)return `<div class="notice">Keine Fehler – alles richtig! 🎉</div>`;
 return `<div class="card"><h3>Falsch beantwortete Vokabeln (${items.length})</h3>${items.map(e=>`<div class="error-item"><b>${esc(cleanStoredText(e.term))}</b><br><span class="muted">Deine Antwort:</span> ${esc(cleanStoredText(e.picked))}<br><span class="muted">Richtig:</span> <b>${esc(cleanStoredText(e.correct))}</b></div>`).join("")}</div>`;
}

function renderExam(){
 const m=examMonth(),list=MONTHS[m-1];
 if(!examOpen())return `<div class="card exam"><h2>Prüfung – ${monthName(m)}</h2><p>Die Prüfung ist nur vom 16.–20. des Monats freigeschaltet.</p></div>`;
 if(!state.exam)return `<div class="card exam"><h2>Prüfung – ${monthName(m)}</h2><p>Die Prüfung umfasst <b>${list.length}</b> Vokabeln.</p><p class="muted">Nach dem Start werden die Antworten bewertet.</p><button id="startExam">Prüfung starten</button></div>`;
 const x=state.exam;
 if(x.i>=list.length){
   const score=Math.round(x.correct/list.length*100);
   return `<div class="card"><h2>Prüfung abgeschlossen</h2><div class="stat">${score}%</div><p>${x.correct} von ${list.length} richtig.</p>${x.saveError?`<div class="notice">Ergebnis konnte nicht in Supabase gespeichert werden: ${esc(x.saveError)}</div>`:`<div class="notice">${x.saved?"Ergebnis wurde gespeichert.":"Ergebnis wird gespeichert …"}</div>`}</div>${mistakeList(x.mistakes)}`;
 }
 const v=list[x.i];
 if(!x.choices)x.choices=makeChoices(list,x.i);
 return `<div class="card exam"><div class="row"><h2>Frage ${x.i+1} / ${list.length}</h2><span class="badge">Prüfung</span></div><div class="progress"><div class="bar" style="width:${((x.i+1)/list.length)*100}%"></div></div><br><h3>${esc(repairWordBreaks(v.term))}</h3><p>Welche Bedeutung ist richtig?</p>${x.choices.map((c,j)=>`<button class="choice" data-answer="${j}">${esc(repairWordBreaks(c))}</button>`).join('')}</div>`;
}

async function loadTrainerResults(){
 state.trainerLoading=true;
 const {data,error}=await sb.from("exam_results").select("id,user_id,month,year,score,correct_count,total_count,mistakes,completed_at,profiles!exam_results_user_id_fkey(full_name)").order("completed_at",{ascending:false});
 state.trainerLoading=false;
 if(error){state.trainerResults={error:error.message};return}
 state.trainerResults=data||[];
}

function trainerResultsView(){
 if(state.trainerLoading)return `<div class="card"><h2>Ergebnisse</h2><p>Lade Ergebnisse …</p></div>`;
 if(state.trainerResults?.error)return `<div class="card"><h2>Ergebnisse</h2><div class="notice">Fehler beim Laden: ${esc(state.trainerResults.error)}</div></div>`;
 if(!state.trainerResults.length)return `<div class="card"><h2>Ergebnisse</h2><p>Noch keine Prüfungsergebnisse vorhanden.</p></div>`;
 return `<div class="card"><h2>Prüfungsergebnisse</h2><div style="overflow-x:auto"><table><thead><tr><th>Azubi</th><th>Prüfung</th><th>Ergebnis</th><th>Datum</th></tr></thead><tbody>${state.trainerResults.map((r,i)=>`<tr><td>${esc(r.profiles?.full_name||"Unbekannt")}</td><td>${esc(monthName(r.month))} ${esc(r.year)}</td><td class="${r.score>=80?'score-good':'score-bad'}">${esc(r.score)}% (${esc(r.correct_count)}/${esc(r.total_count)})</td><td>${esc(new Date(r.completed_at).toLocaleDateString("de-DE"))}</td></tr><tr><td colspan="4">${r.mistakes?.length?`<details><summary><b>${r.mistakes.length} Fehler anzeigen</b></summary>${r.mistakes.map(e=>`<div class="error-item"><b>${esc(cleanStoredText(e.term))}</b><br><span class="muted">Antwort des Azubis:</span> ${esc(cleanStoredText(e.picked))}<br><span class="muted">Richtig:</span> <b>${esc(cleanStoredText(e.correct))}</b></div>`).join("")}</details>`:`<span class="badge">Keine Fehler</span>`}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function bind(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=async()=>{state.tab=b.dataset.go;if(state.tab==="results")await loadTrainerResults();render()});
 if(state.tab==='learn'){
   const p=document.getElementById('prev'),n=document.getElementById('next');
   if(p)p.onclick=()=>{state.learn=Math.max(0,state.learn-1);render()};
   if(n)n.onclick=()=>{state.learn=(state.learn+1)%MONTHS[exerciseMonth()-1].length;render()};
 }
 if(state.tab==='exam'){
   const s=document.getElementById('startExam');
   if(s)s.onclick=()=>{state.exam={i:0,correct:0,choices:null,mistakes:[],saved:false,saveStarted:false};render()};
   document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=async()=>{
     const list=MONTHS[examMonth()-1],v=list[state.exam.i],correct=tidy(v.meaning),picked=tidy(state.exam.choices[Number(b.dataset.answer)]);
     if(picked===correct)state.exam.correct++;
     else state.exam.mistakes.push({term:repairWordBreaks(v.term),picked:repairWordBreaks(picked),correct:repairWordBreaks(correct)});
     state.exam.i++;state.exam.choices=null;
     if(state.exam.i>=list.length&&!state.exam.saveStarted){
       state.exam.saveStarted=true;
       render();
       await saveExamResult(state.exam,list);
     }
     render();
   });
 }
}

function render(){
 if(isTrainer()&&state.tab!=="home"&&state.tab!=="results")state.tab="home";
 let c=isTrainer()?(state.tab==="results"?trainerResultsView():home()):(state.tab==='home'?home():state.tab==='learn'?learnView():renderExam());
 shell(c);bind();
}

async function boot(){
 const {data,error}=await sb.auth.getSession();
 if(error)throw error;
 if(!data.session)return loginScreen();
 state.user=data.session.user;
 const r=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();
 if(r.error)throw r.error;
 if(!r.data)return fail('Benutzerprofil fehlt','Für diesen Benutzer fehlt ein Eintrag in profiles.');
 state.profile=r.data;
 render();
}
try{const c=window.MAINZAHN_CONFIG;if(!c?.supabaseUrl||!c?.supabaseAnonKey)throw new Error('config.js ist leer oder wird nicht gefunden.');const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient(c.supabaseUrl,c.supabaseAnonKey);await boot()}catch(e){fail('Mainzahn konnte nicht gestartet werden',e.message)}

</script>
</body>
</html>
