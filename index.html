.choice.correct{background:#e8f7ef;border-color:#7ac79f} .choice.wrong{background:#fff0ee;border-color:#e49b91}
.small{font-size:12px} .hidden{display:none!important} table{width:100%;border-collapse:collapse} th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
.login{max-width:430px;margin:70px auto} .logo{font-size:42px;font-weight:900;color:var(--brand);margin-bottom:5px}

const compactText=s=>repairWordBreaks(s).toLocaleLowerCase("de-DE").replace(/[^a-z0-9äöüß]/g,"");
function cleanStoredText(s){
  const t=tidy(s);
  const key=compactText(t);
  if(!key) return t;
  for(const list of MONTHS){
    for(const v of list){
      for(const candidate of [v.term,v.meaning,v.practice,v.prep]){
        if(candidate && compactText(candidate)===key) return repairWordBreaks(candidate);
      }
    }
  }
  return repairWordBreaks(t);
}

function makeChoices(list,i){
 const correct=tidy(list[i].meaning);
 let pool=list.map(x=>tidy(x.meaning)).filter(x=>x&&x!==correct);
 pool.sort(()=>Math.random()-.5);
 return [correct,...pool.slice(0,3)].sort(()=>Math.random()-.5);
}

   if(s)s.onclick=()=>{state.exam={i:0,correct:0,choices:null,mistakes:[],saved:false,saveStarted:false};render()};
   document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=async()=>{
     const list=MONTHS[examMonth()-1],v=list[state.exam.i],correct=tidy(v.meaning),picked=tidy(state.exam.choices[Number(b.dataset.answer)]);
     if(picked===correct)state.exam.correct++;
     else state.exam.mistakes.push({term:repairWordBreaks(v.term),picked:repairWordBreaks(picked),correct:repairWordBreaks(correct)});
     state.exam.i++;state.exam.choices=null;
     if(state.exam.i>=list.length&&!state.exam.saveStarted){
       state.exam.saveStarted=true;
       render();
       await saveExamResult(state.exam,list);
     }
     render();
   });
 }
}

function render(){
 if(isTrainer()&&state.tab!=="home"&&state.tab!=="results")state.tab="home";
 let c=isTrainer()?(state.tab==="results"?trainerResultsView():home()):(state.tab==='home'?home():state.tab==='learn'?learnView():renderExam());
 shell(c);bind();
}

async function boot(){
 const {data,error}=await sb.auth.getSession();
 if(error)throw error;
 if(!data.session)return loginScreen();
 state.user=data.session.user;
 const r=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();
 if(r.error)throw r.error;
 if(!r.data)return fail('Benutzerprofil fehlt','Für diesen Benutzer fehlt ein Eintrag in profiles.');
 state.profile=r.data;
 render();
}
try{const c=window.MAINZAHN_CONFIG;if(!c?.supabaseUrl||!c?.supabaseAnonKey)throw new Error('config.js ist leer oder wird nicht gefunden.');const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient(c.supabaseUrl,c.supabaseAnonKey);await boot()}catch(e){fail('Mainzahn konnte nicht gestartet werden',e.message)}

</script>
</body>
</html>
