async function learn(){let q=phase(),list=V[q.learn-1],v=list[li%list.length];return `<div class="card"><div class="row"><h2>Lernen – ${N[q.learn-1]}</h2><span>${li%list.length+1}/${list.length}</span></div><h1>${esc(v.term)}</h1><div id="ans" class="hidden"><h3>${esc(v.meaning)}</h3>${v.practice?`<p><b>Praxis:</b> ${esc(v.practice)}</p>`:""}${v.prep?`<p><b>Aufbereitung:</b> ${esc(v.prep)}</p>`:""}</div><button id="show">Lösung</button> <button class="secondary" id="next">Nächste</button></div>`}
async function examView(){let q=phase();if(!q.exam)return'<div class="card"><h2>Prüfung gesperrt</h2><p>Freischaltung automatisch am 16.</p></div>';let{data:r}=await S.from("exam_results").select("*").eq("user_id",U.id).eq("month",q.m).eq("year",new Date().getFullYear()).limit(1);if(r?.length)return`<div class="card"><h2>Prüfung abgeschlossen</h2><div class="stat">${r[0].score_percent}%</div></div>`;if(!exam)return`<div class="card"><h2>Prüfung – ${N[q.m-1]}</h2><button id="start">Prüfung starten</button></div>`;if(exam.i>=exam.q.length){let sc=Math.round(exam.ok/exam.q.length*100);await S.from("exam_results").insert({user_id:U.id,month:q.m,year:new Date().getFullYear(),correct_count:exam.ok,total_count:exam.q.length,score_percent:sc});exam=null;return`<div class="card"><h2>Gespeichert</h2><div class="stat">${sc}%</div></div>`}let z=exam.q[exam.i];return`<div class="card"><h2>Frage ${exam.i+1}/${exam.q.length}</h2><h1>${esc(z.term)}</h1>${z.c.map((c,i)=>`<button class="choice" data-c="${i}">${esc(c)}</button>`).join("")}</div>`}
async function admin(){let{data:r}=await S.from("exam_results").select("*").order("created_at",{ascending:false});let{data:p}=await S.from("profiles").select("*");return`<div class="card"><h1>Ausbilderbereich</h1><table><tr><th>Azubi</th><th>Monat</th><th>Ergebnis</th><th>Datum</th></tr>${(r||[]).map(x=>`<tr><td>${esc(p?.find(y=>y.id===x.user_id)?.full_name||"–")}</td><td>${N[x.month-1]}</td><td>${x.score_percent}%</td><td>${new Date(x.created_at).toLocaleDateString("de-DE")}</td></tr>`).join("")}</table></div>`}
async function startExam(){let q=phase(),list=V[q.m-1];exam={i:0,ok:0,q:[...list].sort(()=>Math.random()-.5).map(v=>{let w=[...list].filter(x=>x.term!==v.term).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.meaning),c=[v.meaning,...w].sort(()=>Math.random()-.5);return{term:v.term,a:v.meaning,c}})};render()}
function answer(i){let z=exam.q[exam.i];if(z.c[i]===z.a)exam.ok++;exam.i++;render()}
async function render(){let body=tab==="home"?await home():tab==="learn"?await learn():tab==="exam"?await examView():await admin();shell(body);if(tab==="learn"){show?.addEventListener("click",()=>ans.classList.remove("hidden"));next?.addEventListener("click",()=>{li++;render()})}if(tab==="exam"){start?.addEventListener("click",startExam);document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>answer(+b.dataset.c))}}
init();
</script></body></html>
